[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "syncode-agent-service"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langgraph",
    "langchain-core",
    "langchain-groq",
    "langchain-openai",
    "langchain-ollama",
    "langchain-community",
    "sse-starlette",
    "sqlmodel",
    "pydantic",
    "pydantic-settings",
    "websockets",
    "aiofiles",
    "httpx",
    "pywinpty",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]
